<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Interactive algorithm and data structure visualizer built with vanilla JavaScript."
    />

    <meta name="theme-color" content="#f8fafc" />

    <title>Algorithm Visualizer</title>
  </head>

  <body>
    <header>
      <nav aria-label="Main navigation">
        <a href="/" aria-label="Algorithm Visualizer home">
          Algorithm Visualizer
        </a>
      </nav>
    </header>

    <main id="app" class="app">
      <section class="visualizer" aria-labelledby="page-title">
        <header class="visualizer__header">
          <h1 id="page-title">Algorithm Visualizer</h1>

          <p>Explore how algorithms manipulate data step by step.</p>
        </header>

        <section class="visualizer__stage" aria-label="Algorithm visualisation">
          <div id="array-container" class="array-container"></div>
        </section>
      </section>
    </main>

    <footer>
      <p>Algorithm Visualizer</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
